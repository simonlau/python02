[project]
name = "python02"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = []

[tool.pyrefly]
preset = "all"

[tool.ty.src]
exclude = [".agents"]

[tool.ty.rules]
# Enable every available rule and treat all warnings as errors
all = "error"

[tool.ty.analysis]
# Prevent narrowing builtin types to literals on equality checks
strict-equality-semantics = true
# Narrow unspecialized generics (e.g., isinstance(x, list)) to Top[list[Unknown]]
strict-generic-narrowing = true

[tool.ruff]
# Sets the max line length for the formatter and isort
line-length = 79

[tool.ruff.lint]
# Enable absolutely everything by default
preview = true
select = [
    "correctness",
    "suspicious",
    "complexity",
    "performance",
    "style",
    "security",
    "pedantic",
    "restriction"
]

ignore = [
    "undocumented-public-module",
    "undocumented-public-class",
    "undocumented-public-method",
    "undocumented-public-function",
    "undocumented-public-package",
    "undocumented-magic-method",
    "undocumented-public-init",
    "incorrect-blank-line-before-class",
    "multi-line-summary-second-line",
    "missing-trailing-comma",
    "single-line-implicit-string-concatenation",
    "missing-copyright-notice",
    "print",
]

# Ensure you enforce type checking annotations strictly
[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
suppress-dummy-args = false
suppress-none-returning = false
mypy-init-return = true

# Enforce strict import ordering
[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true

# Require explicit updates when code changes
[tool.ruff.lint.pydocstyle]
convention = "pep257" # or "numpy" / "google"'

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
]

