[project]
name = "python02"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [ ]

[tool.pyrefly]
preset = "all"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.4.1",
    "pre-commit>=4.6.2",
    "pyrefly>=1.4.0",
]
